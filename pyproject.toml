[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quota-router"
version = "0.1.0"
description = "Lightweight multi-bucket LLM quota router with circuit breaking and deterministic failover for AI agent loops."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Harry" }]
keywords = ["llm", "ai-agents", "router", "rate-limit", "circuit-breaker", "failover"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
